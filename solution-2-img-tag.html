<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Card - IMG Tag Háttér</title>
    <style>
        .training-card {
            position: relative;
            padding: 70px 40px;
            color: #424242;
            min-height: 400px;
        }

        /* IMG tag mint háttér */
        .training-card-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: fill; /* Torzítást engedélyez, kitölti a teljes területet */
            display: block;
        }

        /* Tartalom előtérbe */
        .training-card-content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="training-card">
        <!-- IMG Háttér -->
        <img src="card-grey-bg.svg"
             alt=""
             class="training-card-bg-img"
             aria-hidden="true">

        <!-- Tartalom -->
        <div class="training-card-content">
            <h3>Alapfokú vezetéstechnikai tréning</h3>
            <p>Kezdőknek és haladóknak</p>
            <p>40 000 Ft/ fő</p>
        </div>
    </div>
</body>
</html>
