<!--
    PÉLDA HTML STRUKTÚRA
    A Gutenberg kódodban így módosítsd a training-type-section részt
-->

<section class="wp-block-group training-type-section fullwide">
    <div class="wp-block-group__inner-container is-layout-constrained wp-block-group-is-layout-constrained">

        <div style="height:144px" aria-hidden="true" class="wp-block-spacer spacer"></div>

        <h2 class="wp-block-heading">Tréning típusok</h2>

        <!-- ÚJ: Tab Navigáció (add hozzá ezt a részt) -->
        <div class="training-tabs-nav">
            <button class="tab-button active" data-tab="training">Tréning</button>
            <button class="tab-button" data-tab="vip-training">VIP tréning</button>
        </div>

        <!-- MÓDOSÍTOTT: Add hozzá a data-tab-content attribútumokat -->
        <div class="wp-block-columns training-cards is-layout-flex wp-container-core-columns-is-layout-9d6595d7 wp-block-columns-is-layout-flex">

            <!-- ELSŐ KÁRTYA - add hozzá: data-tab-content="training" és active class -->
            <div class="wp-block-column training-card active" data-tab-content="training" style="background-size: 100% 100%; background-position: center center;">
                <!-- ... az összes tartalom változatlan marad ... -->
                <p><img decoding="async" width="65" height="62" class="wp-image-102" style="width: 65px;" src="https://malikmotorosoktatas.hu/wp-content/uploads/motor-01.png" alt="motor"></p>

                <h3 class="wp-block-heading">Alapfokú vezetéstechnikai tréning</h3>

                <!-- ... stb ... -->
            </div>

            <!-- MÁSODIK KÁRTYA - add hozzá: data-tab-content="vip-training" -->
            <div class="wp-block-column training-card" data-tab-content="vip-training" style="background-size: 100% 100%; background-position: center center;">
                <!-- ... az összes tartalom változatlan marad ... -->
                <p><img decoding="async" width="65" height="62" class="wp-image-102" style="width: 65px;" src="https://malikmotorosoktatas.hu/wp-content/uploads/motor-01.png" alt="motor"></p>

                <h3 class="wp-block-heading">VIP vezetéstechnikai tréning</h3>

                <!-- ... stb ... -->
            </div>
        </div>

        <!-- ... a többi tartalom változatlan ... -->
    </div>
</section>

<!--
    FONTOS LÉPÉSEK:

    1. Add hozzá a <div class="training-tabs-nav">...</div> részt a training-cards DIV ELÉ

    2. Az első .training-card div-hez add hozzá:
       - data-tab-content="training"
       - active class

    3. A második .training-card div-hez add hozzá:
       - data-tab-content="vip-training"

    4. Illeszd be a CSS-t a style.css-be vagy egyedi CSS fájlba

    5. Illeszd be a JavaScript-et és add hozzá a functions.php-hoz
-->
