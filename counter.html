<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Motoros Tréning - Számláló</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="counter.css">
</head>
<body>
    <section class="counter-section">
        <div class="counter-container">
            <!-- Counter 1 -->
            <div class="counter-item">
                <div class="counter-number">
                    <span class="counter-value" data-target="100">0</span>
                    <span class="counter-suffix">+</span>
                </div>
                <div class="counter-label">Elégedett<br>résztvevő</div>
            </div>

            <!-- Counter 2 -->
            <div class="counter-item">
                <div class="counter-number">
                    <span class="counter-value" data-target="10">0</span>
                    <span class="counter-suffix"> év</span>
                </div>
                <div class="counter-label">Oktatói múlt</div>
            </div>

            <!-- Counter 3 -->
            <div class="counter-item">
                <div class="counter-number">
                    <span class="counter-value" data-target="1000">0</span>
                    <span class="counter-suffix">+</span>
                </div>
                <div class="counter-label">Óra motorozási<br>tapasztalat</div>
            </div>
        </div>
    </section>

    <script>
        // Intersection Observer for triggering animation when in viewport
        const observerOptions = {
            threshold: 0.5,
            rootMargin: '0px'
        };

        const animateCounter = (counter) => {
            const target = parseInt(counter.getAttribute('data-target'));
            const duration = 2000; // 2 seconds
            const increment = target / (duration / 16); // 60fps
            let current = 0;

            const updateCounter = () => {
                current += increment;

                if (current < target) {
                    counter.textContent = Math.floor(current);
                    requestAnimationFrame(updateCounter);
                } else {
                    counter.textContent = target;
                }
            };

            updateCounter();
        };

        const counterObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const counters = entry.target.querySelectorAll('.counter-value');
                    counters.forEach(counter => {
                        // Reset counter
                        counter.textContent = '0';
                        // Start animation
                        animateCounter(counter);
                    });
                    // Unobserve after animation starts (animate only once)
                    counterObserver.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Observe the counter section
        const counterSection = document.querySelector('.counter-section');
        counterObserver.observe(counterSection);
    </script>
</body>
</html>
