<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pillanatok a tréningekről - Galéria</title>
    <link rel="stylesheet" href="photo-gallery.css">
</head>
<body>
    <!-- Gallery Section -->
    <section class="photo-gallery-section">
        <div class="gallery-container">
            <h2 class="gallery-heading">Pillanatok a tréningekről</h2>

            <!-- Infinite Slider -->
            <div class="slider-wrapper">
                <div class="slider-track">
                    <!-- Gallery Items -->
                    <div class="gallery-item" data-index="0">
                        <img src="images/training-1.jpg" alt="Tréning pillanat 1">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="1">
                        <img src="images/training-2.jpg" alt="Tréning pillanat 2">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="2">
                        <img src="images/training-3.jpg" alt="Tréning pillanat 3">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="3">
                        <img src="images/training-4.jpg" alt="Tréning pillanat 4">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="4">
                        <img src="images/training-5.jpg" alt="Tréning pillanat 5">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="5">
                        <img src="images/training-6.jpg" alt="Tréning pillanat 6">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <!-- Cloned items for seamless infinite scroll -->
                    <div class="gallery-item" data-index="0">
                        <img src="images/training-1.jpg" alt="Tréning pillanat 1">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="1">
                        <img src="images/training-2.jpg" alt="Tréning pillanat 2">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="2">
                        <img src="images/training-3.jpg" alt="Tréning pillanat 3">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="3">
                        <img src="images/training-4.jpg" alt="Tréning pillanat 4">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="4">
                        <img src="images/training-5.jpg" alt="Tréning pillanat 5">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>

                    <div class="gallery-item" data-index="5">
                        <img src="images/training-6.jpg" alt="Tréning pillanat 6">
                        <div class="gallery-overlay">
                            <button class="gallery-zoom-btn" aria-label="Kép nagyítása">
                                <span class="plus-icon">+</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-backdrop"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" aria-label="Bezárás">
                <span class="close-icon">×</span>
            </button>

            <button class="lightbox-nav lightbox-prev" aria-label="Előző kép">
                <span class="nav-arrow">‹</span>
            </button>

            <div class="lightbox-image-container">
                <img src="" alt="" id="lightbox-image">
            </div>

            <button class="lightbox-nav lightbox-next" aria-label="Következő kép">
                <span class="nav-arrow">›</span>
            </button>
        </div>
    </div>

    <script src="photo-gallery.js"></script>
</body>
</html>
